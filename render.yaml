# Render Blueprint — deploys backend + frontend with one click
# https://render.com/docs/blueprint-spec

services:
  # ─── Backend (Express + TypeScript) ───────────────────────────────────────
  - type: web
    name: genmash-backend
    runtime: node
    plan: free
    # NODE_ENV=production in envVars would cause npm ci to skip devDeps (breaking tsc).
    # Override to development for install+build, then the service starts in production.
    buildCommand: NODE_ENV=development npm ci && npm run build -w backend
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 24h
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"

      # ── Secrets: set these in the Render dashboard ──
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false

      # ── Set AFTER frontend is deployed ──
      # e.g. https://genmash-frontend.onrender.com
      - key: FRONTEND_URL
        sync: false

  # ─── Frontend (Next.js) ───────────────────────────────────────────────────
  - type: web
    name: genmash-frontend
    runtime: node
    plan: free
    # Same reason: keep NODE_ENV=development during install so devDeps (TypeScript, etc.) are included
    buildCommand: NODE_ENV=development npm ci && npm run build -w frontend
    startCommand: npm run start -w frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # ── Set AFTER backend is deployed ──
      # Must include /api/v1 — e.g. https://genmash-backend.onrender.com/api/v1
      # This is baked into the Next.js bundle at build time.
      # You must trigger a frontend redeploy after updating this.
      - key: NEXT_PUBLIC_API_URL
        sync: false
