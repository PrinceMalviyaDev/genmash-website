services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: genmash-backend
    ports:
      - "5000:5000"
    # Reads backend/.env and injects all vars into the container at runtime
    env_file:
      - ./backend/.env
    environment:
      # Override specific vars for production container
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the Next.js bundle at build time
        NEXT_PUBLIC_API_URL: http://localhost:5000
    container_name: genmash-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
